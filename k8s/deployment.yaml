apiVersion: apps/v1
kind: Deployment
metadata:
  name: hoard
  namespace: hoard
  labels:
    app: hoard
  annotations: {}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hoard
  template:
    metadata:
      labels:
        app: hoard
    spec:
      containers:
        - name: hoard
          image: ghcr.io/stevendejongnl/hoard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8765
              name: http
          env:
            - name: DATABASE_PATH
              value: /data/hoard.db
            - name: UPLOADS_DIR
              value: /data/uploads
            - name: HA_POWER_SENSOR
              value: sensor.nous_3d_printer_feed_plug_power
            - name: HA_POWER_SWITCH
              value: switch.attic_3d_printer_power_strip_machine
            - name: HA_ENERGY_SENSORS
              value: sensor.nous_3d_printer_feed_plug_energy
            - name: HA_SWITCHES
              value: Raspberry Pi=switch.attic_3d_printer_power_strip_pi,Filament dryer=switch.attic_3d_printer_power_strip_filament
            - name: STATIC_DIR
              value: /app/static
            - name: REDIS_URL
              value: redis://redis:6379
            - name: MCP_CLIENTS
              valueFrom:
                secretKeyRef:
                  name: hoard-secrets
                  key: MCP_CLIENTS
                  optional: true
            - name: MOONRAKER_URL
              valueFrom:
                secretKeyRef:
                  name: hoard-secrets
                  key: MOONRAKER_URL
            - name: MOONRAKER_WS
              valueFrom:
                secretKeyRef:
                  name: hoard-secrets
                  key: MOONRAKER_WS
            - name: HA_URL
              valueFrom:
                secretKeyRef:
                  name: hoard-secrets
                  key: HA_URL
            - name: HA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hoard-secrets
                  key: HA_TOKEN
            - name: INFLUXDB_URL
              valueFrom:
                secretKeyRef:
                  name: hoard-secrets
                  key: INFLUXDB_URL
            - name: INFLUXDB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hoard-secrets
                  key: INFLUXDB_TOKEN
            - name: INFLUXDB_ORG
              valueFrom:
                secretKeyRef:
                  name: hoard-secrets
                  key: INFLUXDB_ORG
            - name: INFLUXDB_BUCKET
              valueFrom:
                secretKeyRef:
                  name: hoard-secrets
                  key: INFLUXDB_BUCKET
            - name: VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: hoard-secrets
                  key: VAPID_PUBLIC_KEY
            - name: VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: hoard-secrets
                  key: VAPID_PRIVATE_KEY
            - name: VAPID_SUBJECT
              valueFrom:
                secretKeyRef:
                  name: hoard-secrets
                  key: VAPID_SUBJECT
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/version
              port: 8765
            initialDelaySeconds: 5
            timeoutSeconds: 3
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hoard-data
