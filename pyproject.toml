[project]
name = "printer"
version = "1.30.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "websockets>=13.0",
    "aiosqlite>=0.20",
    "influxdb-client>=1.45",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.19",
    "aiofiles>=24.1",
    "numpy-stl>=3.1",
    "Pillow>=10.0",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "anyio[trio]>=4.6",
    "ruff>=0.15.15",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "PLC"]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["tests/"]
