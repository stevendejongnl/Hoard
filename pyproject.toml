[project]
name = "hoard"
version = "1.46.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "websockets>=13.0",
    "aiosqlite>=0.20",
    "influxdb-client>=1.45",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.19",
    "aiofiles>=24.1",
    "numpy-stl>=3.1",
    "Pillow>=10.0",
    "numpy>=1.26",
    "redis[asyncio]>=5.0",
    "pywebpush>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "anyio[trio]>=4.6",
    "ruff>=0.15.15",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "PLC", "C901", "PLR0912", "PLR0915", "N"]
ignore = [
    "E501",
]

# Structure limits are the worst value found now. They were 23, 66 and 22 when the rules were added, and the
# backend cleanup (STE-102 to 104) brought them down to complexity 9, statements 30 and branches 8.
[tool.ruff.lint.mccabe]
max-complexity = 9

[tool.ruff.lint.pylint]
max-statements = 30
max-branches = 8

[tool.ruff.lint.per-file-ignores]
# the thumbnail renderer names rotation matrices Rx and Ry, as the mathematics does
"app/thumbnail.py" = ["N806"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["tests/"]
