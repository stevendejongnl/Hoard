[project]
name = "printer"
version = "1.14.2"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "websockets>=13.0",
    "aiosqlite>=0.20",
    "influxdb-client>=1.45",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.19",
    "aiofiles>=24.1",
    "numpy-stl>=3.1",
    "Pillow>=10.0",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "anyio[trio]>=4.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.uv]
package = false
