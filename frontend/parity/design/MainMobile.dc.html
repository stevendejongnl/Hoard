<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F45BCB","options":["#F45BCB","#FA6831","#00A3FF","#B6F23B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = this.props.accent || '';
    const a = /^#[0-9a-fA-F]{6}$/.test(raw) ? raw : '#F45BCB';
    const n = parseInt(a.slice(1), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const lin = (c) => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
    const L = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
    const cDark = (L + 0.05) / (0.0103 + 0.05);
    const cWhite = 1.05 / (L + 0.05);
    const mix = (c, base) => Math.round(base + (c - base) * 0.18);
    return {
      accent: a,
      onAccent: cDark >= cWhite ? '#1A1A1D' : '#FFFFFF',
      tint: 'rgb(' + mix(r, 43) + ',' + mix(g, 43) + ',' + mix(b, 47) + ')'
    };
  }
}
