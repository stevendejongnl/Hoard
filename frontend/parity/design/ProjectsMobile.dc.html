<style>

.fld { display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; min-width: 76px; height: 24px; padding: 0 8px; box-sizing: border-box; background: #1A1A1D; border: 1px solid #45454C; border-radius: 2px; font: 400 12px 'JetBrains Mono', monospace; color: #E4E4E7; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: 2px; border: 1px solid #5A5A62; background: #3A3A40; color: #E4E4E7; font: 600 13px Barlow, sans-serif; cursor: pointer; text-decoration: none; }
.btn:hover { background: #46464D; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn.pri:hover { filter: brightness(1.1); }
.btn.danger { color: #FF8A80; }
.btn.estop { background: #C62828; border-color: #C62828; color: #fff; }
.btn.estop:hover { background: #B71C1C; }
.btn.ico { padding: 0; width: 36px; }
.btn.flat { background: transparent; border-color: transparent; }
.btn.flat:hover { background: #46464D; }
.btn:focus-visible, a:focus-visible, button:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
.li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid #3E3E44; font-size: 13px; }
.li:hover { background: #323237; }
.li.sel { background: var(--tint); box-shadow: inset 3px 0 0 var(--accent); }
.th { flex: none; width: 36px; height: 36px; border-radius: 2px; background: #1A1A1D; border: 1px solid #45454C; display: grid; place-items: center; color: #9A9AA3; }
.tr { display: grid; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border-top: 1px solid #3E3E44; font-size: 13px; }
.tr:hover { background: #323237; }
.tr.sel { background: var(--tint); box-shadow: inset 3px 0 0 var(--accent); }
.tr.hd { min-height: 32px; border-top: 0; background: #323237; font: 600 12px Barlow, sans-serif; letter-spacing: .04em; text-transform: uppercase; color: #B8B8C0; }
.tr.hd:hover { background: #323237; }
.card { background: #2B2B2F; border: 1px solid #3E3E44; border-radius: 2px; }
.dot { animation: dot 2s ease-in-out infinite; }
@keyframes dot {
  0% { opacity: 1; }
  50% { opacity: .35; }
  100% { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .dot { animation: none; }
}

.mtab { flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #9A9AA3; text-decoration: none; font: 600 12px Barlow, sans-serif; border-top: 3px solid transparent; }
.mtab.on { color: #fff; border-top-color: var(--accent); }
.mtab.on svg { color: var(--accent); }
.chip2 { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 2px; border: 1px solid #45454C; background: #1A1A1D; color: #E4E4E7; font: 600 13px Barlow, sans-serif; cursor: pointer; }
.chip2.on { border-color: var(--accent); }
.mrow { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 16px; border-bottom: 1px solid #3E3E44; text-decoration: none; color: #E4E4E7; }
.mrow:hover { background: #323237; }
.in { width: 100%; box-sizing: border-box; min-height: 44px; padding: 0 12px 0 40px; border-radius: 2px; border: 1px solid #45454C; background: #1A1A1D; color: #E4E4E7; font: 400 15px Barlow, sans-serif; }
.in::placeholder { color: #9A9AA3; }
.in:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
</style>

-decoration: none; color: #E4E4E7; display: flex; flex-direction: column; overflow: hidden"><div style="aspect-ratio: 16 / 10; background: #1A1A1D; display: grid; place-items: center; color: #9A9AA3; border-bottom: 1px solid #3E3E44"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></svg></div><div style="padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px"><span style="font: 600 15px Barlow, sans-serif">Doorhandle</span><span class="mu" style="font-size: 12px">2 prints · 6h 44m</span><span class="mono" style="font-size: 12px; color: var(--accent)">€1.90</span></div></a><a href="ProjectDetailMobile.dc.html" class="card" style="text-decoration: none; color: #E4E4E7; display: flex; flex-direction: column; overflow: hidden"><div style="aspect-ratio: 16 / 10; background: #1A1A1D; display: grid; place-items: center; color: #9A9AA3; border-bottom: 1px solid #3E3E44"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></svg></div><div style="padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px"><span style="font: 600 15px Barlow, sans-serif">Lego F1 stand</span><span class="mu" style="font-size: 12px">2 prints · 7h 16m</span><span class="mono" style="font-size: 12px; color: var(--accent)">€0.00</span></div></a><a href="ProjectDetailMobile.dc.html" class="card" style="text-decoration: none; color: #E4E4E7; display: flex; flex-direction: column; overflow: hidden"><div style="aspect-ratio: 16 / 10; background: #1A1A1D; display: grid; place-items: center; color: #9A9AA3; border-bottom: 1px solid #3E3E44"><svg width="32" height="32" viewBox="0 0 24 2 <script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F45BCB","options":["#F45BCB","#FA6831","#00A3FF","#B6F23B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = this.props.accent || '';
    const a = /^#[0-9a-fA-F]{6}$/.test(raw) ? raw : '#F45BCB';
    const n = parseInt(a.slice(1), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const lin = (c) => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
    const L = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
    const cDark = (L + 0.05) / (0.0103 + 0.05);
    const cWhite = 1.05 / (L + 0.05);
    const mix = (c, base) => Math.round(base + (c - base) * 0.18);
    return {
      accent: a,
      onAccent: cDark >= cWhite ? '#1A1A1D' : '#FFFFFF',
      tint: 'rgb(' + mix(r, 43) + ',' + mix(g, 43) + ',' + mix(b, 47) + ')'
    };
  }
}
</script>
