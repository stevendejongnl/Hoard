name: Build & Push Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write

    outputs:
      version: ${{ steps.semrel.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/git @semantic-release/github @semantic-release/changelog

      - name: Run semantic-release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release
          git fetch --tags
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

  build:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (latest + version tag if released)
        run: |
          TAGS="ghcr.io/stevendejongnl/printer:latest"
          if [ -n "${{ needs.release.outputs.version }}" ]; then
            TAGS="$TAGS,ghcr.io/stevendejongnl/printer:${{ needs.release.outputs.version }}"
          fi
          docker buildx build \
            --platform linux/amd64 \
            --push \
            $(echo "$TAGS" | tr ',' '\n' | sed 's/^/-t /') \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .
