name: Build & Deploy
run-name: "Build & Deploy v${{ github.event.client_payload.version }}"

on:
  repository_dispatch:
    types: [release-created]

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Validate inputs
        env:
          VERSION: ${{ github.event.client_payload.version }}
          COMMIT_SHA: ${{ github.event.client_payload.commit_sha }}
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi
          if ! echo "$COMMIT_SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "Invalid commit SHA: $COMMIT_SHA"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/printer:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/printer:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
